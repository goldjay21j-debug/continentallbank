# Netlify build configuration for Continental Bank (Next.js 16).
# The @netlify/plugin-nextjs plugin is auto-installed by Netlify when it
# detects a Next.js project, so it does not need to be a devDependency.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node 20.9+ (or 22.11+). Pin to Node 20 LTS.
  NODE_VERSION = "20"
  # Skip Next.js telemetry in CI builds.
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
